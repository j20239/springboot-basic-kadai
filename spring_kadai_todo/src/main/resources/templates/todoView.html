<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>
	<table border="1">
		<tr>
			<th>id</th>
			<th>title</th>
			<th>priority</th>
			<th>status</th>
		</tr>
		<tr th:each="todo : ${todos}">
			<td th:text="${todo.id}"></td>
			<td th:text="${todo.title}"></td>
			<td th:text="${todo.priority}"></td>
			<td th:text="${todo.status}"></td>
		</tr>
	</table>
</body>

</html>
